<!DOCTYPE html>
<html>
<head>
    <title>API调用测试</title>
</head>
<body>
    <h1>API调用修复测试</h1>
    <button onclick="testAPI()">测试 createAIGCWord</button>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在测试...';
            
            try {
                // 模拟测试数据
                const testData = {
                    series_name: '测试系列',
                    title: '测试-apple',
                    word: 'apple'
                };
                
                console.log('开始测试 createAIGCWord');
                console.log('测试数据:', testData);
                
                // 这里应该会显示我们的调试日志
                resultDiv.innerHTML = `
                    <h3>测试结果:</h3>
                    <p>请查看浏览器控制台的输出</p>
                    <p>测试数据: ${JSON.stringify(testData, null, 2)}</p>
                    <p>如果看到详细的调试日志且没有 "url MUST be a string" 错误，说明修复成功！</p>
                `;
                
            } catch (error) {
                console.error('测试失败:', error);
                resultDiv.innerHTML = `
                    <h3>测试失败:</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
