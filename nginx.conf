server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer支持所需的关键头部
    # 这些头部必须添加到所有路由
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    
    # 设置正确的MIME类型
    location ~* \.(js)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    location ~* \.(css)$ {
        add_header Content-Type "text/css; charset=utf-8";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    location ~* \.(svg)$ {
        add_header Content-Type "image/svg+xml";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    location ~* \.(png|jpg|jpeg|gif)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    location ~* \.(wasm)$ {
        add_header Content-Type "application/wasm";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    # 主路由处理
    location / {
        # 这些是允许SharedArrayBuffer工作的关键头部
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        # 其他头部
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;
        
        # SPA路由处理 - 所有不存在的路径重定向到index.html
        try_files $uri $uri/ /index.html;
    }

    # 专门处理FFmpeg文件夹 - 这很重要
    location /ffmpeg/ {
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        
        # 继承主配置中的COOP和COEP头
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        
        expires 1y;
    }

    # 处理预检请求
    location ~ ^.+\.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|wasm)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range" always;
            
            # 继承主配置中的COOP和COEP头
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
}
