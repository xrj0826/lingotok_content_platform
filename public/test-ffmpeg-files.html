<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FFmpeg文件测试</title>
</head>
<body>
    <h1>FFmpeg文件可访问性测试</h1>
    <div id="results"></div>

    <script>
        async function testFiles() {
            const results = document.getElementById('results');
            const files = [
                '/ffmpeg/ffmpeg-core.js',
                '/ffmpeg/ffmpeg-core.wasm',
                '/ffmpeg/ffmpeg-core.worker.js'
            ];

            results.innerHTML = '<h2>测试结果:</h2>';

            for (const file of files) {
                try {
                    const response = await fetch(file);
                    const size = response.headers.get('content-length');
                    const status = response.ok ? '✅ 可访问' : `❌ 错误 ${response.status}`;
                    const sizeText = size ? ` (${Math.round(size / 1024)}KB)` : '';
                    
                    results.innerHTML += `<p>${file}: ${status}${sizeText}</p>`;
                } catch (error) {
                    results.innerHTML += `<p>${file}: ❌ 网络错误 - ${error.message}</p>`;
                }
            }

            // 测试环境
            results.innerHTML += '<h2>环境检查:</h2>';
            results.innerHTML += `<p>SharedArrayBuffer: ${typeof SharedArrayBuffer !== 'undefined' ? '✅' : '❌'}</p>`;
            results.innerHTML += `<p>crossOriginIsolated: ${crossOriginIsolated ? '✅' : '❌'}</p>`;
            results.innerHTML += `<p>协议: ${location.protocol}</p>`;
        }

        window.addEventListener('load', testFiles);
    </script>
</body>
</html>
